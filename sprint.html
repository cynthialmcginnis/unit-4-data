<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Right AI, Right Data</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Source+Sans+3:wght@400;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{
  --c0:#b9b2a3; --c1:#009488; --c2:#c46c00; --c3:#7a52c7; --c4:#d0507e; --c5:#3d86c6;
  --bg:#e9e4d8; --paper:#fbf8f1; --paper2:#f3eee2; --ink:#1d2430; --muted:#5a6270; --line:#d9d1bf;
  --accent:#0f6e6e; --accent-soft:#d5ecea; --amber:#b86a0c; --amber-soft:#f8e6cc;
  --good:#2e7d4f; --good-soft:#dcefe2; --bad:#b3362c; --bad-soft:#f6dcd8; --violet:#5b4bb0; --violet-soft:#e4e0f6;
  --shadow:0 14px 40px rgba(40,30,10,.14);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --c0:#56606d; --c1:#14a094; --c2:#c97a20; --c3:#8a6ddb; --c4:#d65a87; --c5:#4590d6;
    --bg:#11151b; --paper:#1b212a; --paper2:#232b36; --ink:#ece7dc; --muted:#a3abb8; --line:#333d4a;
    --accent:#4fc3b8; --accent-soft:#163a3a; --amber:#f0a94a; --amber-soft:#3d2c14;
    --good:#6fcf97; --good-soft:#173324; --bad:#f07a6e; --bad-soft:#3d1c19; --violet:#a99cf0; --violet-soft:#29244a;
    --shadow:0 14px 40px rgba(0,0,0,.5);
  }
}
:root[data-theme="dark"]{
  --c0:#56606d; --c1:#14a094; --c2:#c97a20; --c3:#8a6ddb; --c4:#d65a87; --c5:#4590d6;
    --bg:#11151b; --paper:#1b212a; --paper2:#232b36; --ink:#ece7dc; --muted:#a3abb8; --line:#333d4a;
  --accent:#4fc3b8; --accent-soft:#163a3a; --amber:#f0a94a; --amber-soft:#3d2c14;
  --good:#6fcf97; --good-soft:#173324; --bad:#f07a6e; --bad-soft:#3d1c19; --violet:#a99cf0; --violet-soft:#29244a;
  --shadow:0 14px 40px rgba(0,0,0,.5);
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:18px/1.55 "Source Sans 3",system-ui,sans-serif}
h1,h2,h3{font-family:Fraunces,Georgia,serif;line-height:1.15;margin:0 0 .45em}
h1{font-size:clamp(2rem,5vw,3.2rem)} h2{font-size:clamp(1.4rem,3vw,2rem)} h3{font-size:1.15rem}
p{margin:.4em 0 .9em} button{font:inherit;color:inherit}
.mono{font-family:"JetBrains Mono",monospace;font-size:.88em}
#top{position:sticky;top:0;z-index:10;background:var(--paper);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px;padding:8px 16px;flex-wrap:wrap}
#top .t{font-weight:700;flex:1;min-width:160px}
#steps{display:flex;gap:4px;flex-wrap:wrap}
#steps span,#steps button{font:inherit;font-size:.8rem;padding:4px 10px;border-radius:99px;border:1px solid var(--line);color:var(--muted);background:transparent}
#steps button{cursor:pointer}
#steps button:hover{border-color:var(--accent);color:var(--accent)}
.topback{margin:0 0 14px}
#steps span.on{background:var(--accent);border-color:var(--accent);color:var(--paper)}
#steps span.done{border-color:var(--accent);color:var(--accent)}
.tb{border:1px solid var(--line);background:var(--paper2);border-radius:8px;padding:5px 11px;cursor:pointer;font-size:.88rem}
main{max-width:1080px;margin:0 auto;padding:22px 16px 60px}
.sheet{background:var(--paper);border-radius:14px;box-shadow:var(--shadow);padding:30px 34px;margin-bottom:18px}
.kicker{text-transform:uppercase;letter-spacing:.14em;font-size:.78rem;font-weight:700;color:var(--accent);margin-bottom:6px}
.lead{font-size:1.15rem}
.muted{color:var(--muted)}
.def{border-left:5px solid var(--accent);background:var(--accent-soft);padding:10px 16px;border-radius:0 10px 10px 0;margin:12px 0}
.next{display:flex;gap:10px;border-left:5px solid var(--amber);background:var(--amber-soft);padding:12px 16px;border-radius:0 10px 10px 0;margin:14px 0}
.next .lbl{color:var(--amber);white-space:nowrap}
.grid2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:20px}
.grid2>*{min-width:0}
.card{background:var(--paper2);border:1px solid var(--line);border-radius:12px;padding:14px 16px}
label.f{display:block;font-weight:600;margin:14px 0 5px}
input[type=text],textarea{font:inherit;color:var(--ink);background:var(--paper);border:1px solid var(--line);border-radius:8px;padding:8px 10px;width:100%}
textarea{min-height:92px;resize:vertical}
.btn{border:1px solid var(--accent);background:var(--accent);color:var(--paper);border-radius:9px;padding:9px 18px;cursor:pointer;font-weight:600}
.btn.ghost{background:transparent;color:var(--accent)}
.btn:disabled{opacity:.45;cursor:default}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:12px 0}
.sitepick{display:flex;gap:8px}
.sitepick button{flex:1;border:2px solid var(--line);background:var(--paper);border-radius:10px;padding:12px;cursor:pointer;font-weight:700}
.sitepick button.on{border-color:var(--accent);background:var(--accent-soft)}
.counter{font-size:.85rem;color:var(--muted)}
.board{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px;margin-top:10px}
.org{border:2px solid var(--line);background:var(--paper);border-radius:14px;padding:16px;cursor:pointer;text-align:left;position:relative}
.org:hover{border-color:var(--accent)}
.org .no{font-family:"JetBrains Mono",monospace;font-size:.8rem;color:var(--muted)}
.org .pill,.pill{display:inline-block;font-size:.78rem;font-weight:700;padding:2px 10px;border-radius:99px;background:var(--violet-soft);color:var(--violet);margin:4px 4px 0 0}
.org.done{border-color:var(--good);background:var(--good-soft)}
.org .stamp{position:absolute;top:10px;right:12px;font-size:.75rem;font-weight:700;color:var(--good)}
.choices{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:10px;margin:10px 0}
.choice{border:2px solid var(--line);background:var(--paper);border-radius:12px;padding:12px 14px;cursor:pointer;text-align:left}
.choice:hover{border-color:var(--accent)}
.choice.on{border-color:var(--accent);background:var(--accent-soft)}
.choice b{display:block;margin-bottom:3px}
.choice .d{font-size:.9rem}
.choice .in{font-size:.84rem;color:var(--muted);margin-top:4px}
.choice.best{border-color:var(--good);background:var(--good-soft)}
.choice.ok{border-color:var(--amber);background:var(--amber-soft)}
.choice.miss{border-color:var(--bad);background:var(--bad-soft)}
.choices.locked .choice{cursor:default}
.choices.small{grid-template-columns:repeat(auto-fill,minmax(190px,1fr))}
.choices.small .choice{padding:9px 12px}
.choices.small .d{font-size:.84rem}
table{border-collapse:collapse;width:100%;font-size:.92rem;margin:8px 0}
th,td{text-align:left;padding:7px 9px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:.78rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.datab{overflow-x:auto}
.datab td{font-family:"JetBrains Mono",monospace;font-size:.82rem;white-space:nowrap}
.sample{border:1px dashed var(--line);border-radius:10px;padding:10px 12px;margin:6px 0;font-size:.92rem;background:var(--paper)}
.verdict{border-radius:12px;padding:14px 16px;margin:12px 0}
.verdict.best{background:var(--good-soft);border:1px solid var(--good)}
.verdict.ok{background:var(--amber-soft);border:1px solid var(--amber)}
.verdict.miss{background:var(--bad-soft);border:1px solid var(--bad)}
.good{color:var(--good)} .bad{color:var(--bad)} .amb{color:var(--amber)}
.score{font-family:Fraunces,serif;font-size:1.6rem;color:var(--accent)}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;align-items:flex-start;justify-content:center;z-index:50;padding:20px;overflow:auto}
.modal.show{display:flex}
.modal .box{background:var(--paper);border-radius:16px;padding:28px 32px;max-width:900px;width:100%;box-shadow:var(--shadow)}
.blur{filter:blur(9px);user-select:none;transition:filter .5s}
.handout{display:none}
.ver{display:inline-block;font-size:.75rem;font-weight:700;padding:2px 10px;border-radius:99px;background:var(--amber-soft);color:var(--amber);margin-left:6px;vertical-align:2px}
.parts{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px;margin:14px 0}
.parts .card b{display:block;color:var(--accent)}
select{font:inherit;color:var(--ink);background:var(--paper);border:1px solid var(--line);border-radius:8px;padding:8px 10px;width:100%}
.kindtag{display:inline-block;font-family:"Source Sans 3",sans-serif;font-size:.72rem;font-weight:700;letter-spacing:0;text-transform:none;padding:1px 8px;border-radius:99px;background:var(--accent-soft);color:var(--accent)}
.ins{display:flex;flex-direction:column;gap:6px}
.inbox{display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:8px;padding:6px 10px;background:var(--paper);cursor:pointer}
.concl{border-left:5px solid var(--violet);margin:14px 0}
.concl ul{margin:6px 0 0;padding-left:20px}
.concl li{margin:5px 0}
.chartbox{margin:16px 0}
.chartbox .ct{font-weight:700;margin-bottom:6px}
.chart{display:block;width:100%;max-width:680px;height:auto;background:var(--paper);border:1px solid var(--line);border-radius:10px}
.chart .tx{font:12px "Source Sans 3",system-ui,sans-serif;fill:var(--muted)}
.chart .tx.s{font-size:11px}
.chart .tx.b{fill:var(--ink);font-weight:700}
.chart .tx.on{fill:#fff;font-weight:700}
.chart .ax{stroke:var(--muted);stroke-width:1;opacity:.6}
.chart .grid{stroke:var(--line);stroke-width:1}
.chart .ref{stroke:var(--muted);stroke-width:1.5;stroke-dasharray:5 4}
.lg{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:.88rem;margin:4px 0 8px}
.lg i{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.lg i.dot{border-radius:50%}
.lg i.ring{background:transparent!important;border:2.5px solid var(--c2);border-radius:50%}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px;margin:12px 0}
.lines{border-bottom:1px solid #999;height:28px}
@media (max-width:760px){ .grid2{grid-template-columns:1fr} .sheet{padding:20px 16px} }
@media print{
  body{background:#fff;color:#000;font-size:12pt}
  #top,.noprint,.modal{display:none!important}
  main{padding:0;max-width:none}
  .sheet{box-shadow:none;padding:0;margin:0 0 14px}
  body.ho #app{display:none}
  body.ho .handout{display:block}
  .pb{page-break-before:always}
  .verdict,.card,.choice{break-inside:avoid}
}
</style>
</head>
<body>
<div id="top">
  <div class="t">Unit 4 AI Lab Sprint · Right AI, Right Data <span class="ver">Version 2 · with Part D, Test it on data</span></div>
  <div id="steps"></div>
  <button class="tb noprint" id="theme" title="Light or dark">◐</button>
</div>
<main id="app"></main>
<div class="handout" id="handout"></div>

<div class="modal" id="brief"><div class="box" id="briefBox"></div></div>

<script>
/* ======================= DATA ======================= */
const TYPES=[
 {id:'class',name:'Classification',d:'Sorts each record into one of a set of categories, learned from labeled examples.'},
 {id:'reg',name:'Regression',d:'Predicts a number.'},
 {id:'fore',name:'Time-series forecasting',d:'Predicts future values of a number from its past values over time.'},
 {id:'clus',name:'Clustering',d:'Finds groups of similar records on its own. Needs no labels.'},
 {id:'anom',name:'Anomaly detection',d:'Flags records that are unusual compared with the rest. Needs no labels.'},
 {id:'rec',name:'Recommendation',d:'Suggests items to each person based on what similar people did.'},
 {id:'rl',name:'Reinforcement learning',d:'An agent learns by trial and error. It tries actions, earns or loses points, and over many tries learns which actions earn the most.'},
 {id:'od',name:'Object detection',d:'Finds where things are in an image and draws a box around each one.'},
 {id:'speech',name:'Speech recognition',d:'Turns spoken words in audio into written text.'},
 {id:'sent',name:'Sentiment analysis',d:'Reads text and judges whether its tone is positive, negative, or neutral.'},
 {id:'gen',name:'Generation',d:'Creates new text, images, or code from instructions, such as a chatbot. This is generative AI (GenAI).'}];
const TOOLS=[
 {id:'canvas',name:'Amazon SageMaker Canvas',d:'Builds a prediction model from your data with no coding. Predicts a category or a number, and can forecast a number over time.',in:'Takes in: tables with a column to predict. It can also train on labeled images or labeled text.'},
 {id:'azure',name:'Azure Machine Learning automated ML',d:'Automated machine learning (ML): tries many models on your table and keeps the best one, with little or no coding. Predicts a category or a number, or forecasts over time.',in:'Takes in: tables with a column to predict.'},
 {id:'vertex',name:'Google Vertex AI AutoML',d:'Trains a custom model from your labeled data with little or no coding. Predicts a category or a number, forecasts over time, or learns to recognize things in images.',in:'Takes in: tables with a column to predict, or labeled images.'},
 {id:'orange',name:'Orange Data Mining',d:'Free visual tool with no coding. You connect boxes on screen to sort records into categories, predict numbers, find groups, or flag unusual records.',in:'Takes in: tables.'},
 {id:'knime',name:'KNIME Analytics Platform',d:'Free visual tool with no coding. You connect boxes on screen to clean data, sort records into categories, predict numbers, find groups, or flag unusual records.',in:'Takes in: tables.'},
 {id:'excel',name:'Microsoft Excel Forecast Sheet',d:'Projects a number forward in time from its past values.',in:'Takes in: one column of dates and one column of numbers.'},
 {id:'rekog',name:'Amazon Rekognition Custom Labels',d:'Learns to recognize things in photos that you label yourself. It can sort whole photos into categories or draw boxes around objects.',in:'Takes in: labeled images.'},
 {id:'gvision',name:'Google Cloud Vision API',d:'Recognizes common objects, faces, and printed text in photos, using a model Google already trained. It does not learn your own categories. API means application programming interface: a way for other software to use the tool.',in:'Takes in: images.'},
 {id:'tm',name:'Google Teachable Machine',d:'Trains a simple model in your web browser to recognize images, sounds, or body poses. Free and quick for a test, not built for daily use.',in:'Takes in: images, sound clips, or poses from a webcam.'},
 {id:'comp',name:'Amazon Comprehend',d:'Reads text and finds sentiment, key phrases, and topics. Its custom classification feature learns your own categories from labeled examples.',in:'Takes in: text.'},
 {id:'gnl',name:'Google Cloud Natural Language',d:'Reads text and finds its sentiment, the names of people and places in it, and its general topic, using a model Google already trained.',in:'Takes in: text.'},
 {id:'translate',name:'Amazon Translate',d:'Translates text from one language to another.',in:'Takes in: text.'},
 {id:'trans',name:'Amazon Transcribe',d:'Turns speech in audio files into written text.',in:'Takes in: audio recordings.'},
 {id:'gstt',name:'Google Cloud Speech-to-Text',d:'Turns speech in audio into written text, in many languages.',in:'Takes in: audio recordings.'},
 {id:'polly',name:'Amazon Polly',d:'Turns written text into spoken audio.',in:'Takes in: text.'},
 {id:'textract',name:'Amazon Textract',d:'Pulls printed and handwritten text and tables out of scanned documents.',in:'Takes in: scanned pages and PDF files.'},
 {id:'pers',name:'Amazon Personalize',d:'Suggests items to each user based on what similar users chose.',in:'Takes in: records of which user used or bought which item, and when.'},
 {id:'sb3',name:'Stable-Baselines3 with Gymnasium',d:'Free Python code library. An agent learns by trial and error inside a simulation, earning points for good actions. Requires coding.',in:'Takes in: a simulation with a point score, not a table of past examples.'}];

/* best/ok: lists of ids. why: shown after lock-in. */
const CASES=[
 {id:'c1',no:'Case 1',site:'Yokota',name:'Pacific Rim Logistics',area:'Logistics',data:'Table',
  what:'A parts supply depot that ships aircraft and ship parts to bases across the Pacific.',
  who:'The logistics chief',
  problem:'Every morning the logistics chief picks which incoming shipments her team tracks closely. She wants to know, for each shipment, whether it will arrive late.',
  have:'18,000 past shipments from the last four years. Each row is one shipment. The last column records whether it arrived late.',
  sample:{cols:['shipment_id','origin_port','carrier','weight_kg','days_scheduled','customs_hold','arrived_late'],
   rows:[['S-20411','Busan','Carrier A','412','6','No','No'],['S-20412','Long Beach','Carrier C','2,180','14','Yes','Yes'],['S-20413','Singapore','Carrier B','95','9','No','No']]},
  type:{best:['class'],ok:[]},
  tool:{best:['canvas'],ok:['azure','vertex','orange','knime']},
  typeWhy:'The output is a category: late or on time. The data already has that label for every past shipment, so the model can learn from examples. That is classification.',
  toolWhy:'The data is a table with a labeled column to predict, which is exactly what SageMaker Canvas takes in, with no coding. Azure automated ML and Vertex AI AutoML do the same job on other clouds, and Orange and KNIME can classify a table for free. All four are accepted. Excel Forecast Sheet is not a fit: it projects a number over time, not a yes or no for each shipment.',
  concern:'Representation: if most shipments came from a few ports, the model may not learn routes it rarely saw. Timeliness: carriers and routes change, so four-year-old shipments may not match today.'},
 {id:'c2',no:'Case 2',site:'Iwakuni',name:'Kintai Coffee Roasters',area:'Business',data:'Table over time',
  what:'A small coffee roaster near the base that sells beans to cafes and at its own shop.',
  who:'The owner',
  problem:'Every Friday the owner decides how many kilograms of coffee beans to roast for the next week. Roast too much and the beans go stale. Roast too little and the shop runs out.',
  have:'Three years of daily sales. Each row is one day.',
  sample:{cols:['date','day_of_week','kg_sold','holiday','rain','base_payday'],
   rows:[['2026-10-12','Monday','18.5','No','Yes','No'],['2026-10-13','Tuesday','21.0','No','No','No'],['2026-10-15','Thursday','29.5','No','No','Yes']]},
  type:{best:['fore'],ok:['reg']},
  tool:{best:['canvas','azure','vertex'],ok:['excel','orange','knime']},
  typeWhy:'The output is a number for future days, predicted from past days: kilograms of beans next week. That is time-series forecasting. Regression is accepted, because forecasting is a kind of regression, but regression alone does not use the order of the days.',
  toolWhy:'SageMaker Canvas, Azure automated ML, and Vertex AI AutoML all forecast a number over time and can use the extra columns such as holidays and paydays. Excel Forecast Sheet is accepted: it is quick and free, but it uses only the date and kg_sold columns and ignores holidays and paydays. Orange and KNIME are accepted because they can predict a number from a table.',
  concern:'Completeness: days the shop was closed may be missing or recorded as zero sales. Timeliness: a new cafe customer or a base population change makes old sales a poor guide.'},
 {id:'c3',no:'Case 3',site:'Yokota',name:'Shield Point Cyber',area:'Cybersecurity',data:'Text',
  what:'A cybersecurity company that protects email for several small defense contractors.',
  who:'The on-duty security analyst',
  problem:'Every hour the analyst decides which incoming emails to block. She wants each email marked as phishing or safe. Phishing is a fake email that tries to trick a person into giving up a password or opening a harmful file.',
  have:'40,000 past emails. Analysts already marked each one as phishing or safe.',
  sampleText:['Subject: Your mailbox is full. Click here within 24 hours to keep your account. → <b>phishing</b>','Subject: Minutes from Tuesday\'s contract review are attached. → <b>safe</b>','Subject: Payroll update required. Confirm your bank details today. → <b>phishing</b>'],
  type:{best:['class'],ok:[]},
  tool:{best:['comp'],ok:['canvas']},
  typeWhy:'The output is a category: phishing or safe. The analysts already labeled 40,000 examples, so the model learns from them. That is classification. The data is text, so this is classification using natural language processing.',
  toolWhy:'Amazon Comprehend reads text, and its custom classification feature learns the company\'s own two categories from the labeled emails. SageMaker Canvas can also train on labeled text, so it is accepted. Google Cloud Natural Language is not a fit: it finds tone and general topics with a model Google already trained, and it does not learn the company\'s own phishing labels.',
  concern:'Timeliness: phishing tricks change every month, so old examples go stale fast. Representation: if almost all phishing examples are in English, Japanese-language phishing may slip through.'},
 {id:'c4',no:'Case 4',site:'Iwakuni',name:'Gate Watch Security',area:'Physical security',data:'Table',
  what:'A security company that guards a business park with 30 buildings. Every door opens with an ID badge. Each time someone holds a badge to a door reader, the system records a <b>badge swipe</b>: who, which door, and when. IT means information technology.',
  who:'The night security supervisor',
  problem:'Last month someone used a cleaning crew badge to enter a server room at 2 a.m. and took two laptops. Nobody noticed for a week. The park records about 5,500 badge swipes every night, far too many for one person to read. Each morning the supervisor wants a short list of last night\'s swipes that do not fit the usual pattern, so a guard can check the camera video for those swipes first.',
  have:'Two million badge swipes from the last year. Each row is one swipe. Nobody has ever marked which past swipes were suspicious, so no column says "suspicious."',
  sample:{cols:['badge_id','building','door','time','day','access_granted','role'],
   rows:[['B-0381','12','Server room','02:14','Sunday','Yes','Cleaning staff'],['B-1177','4','Main lobby','07:52','Monday','Yes','Office staff'],['B-0920','4','Loading dock','07:55','Monday','No','Visitor']]},
  type:{best:['anom'],ok:['clus']},
  tool:{best:['orange','knime'],ok:[]},
  typeWhy:'There are no labels, so the model cannot learn what "suspicious" looks like from examples. It can learn what normal looks like and flag swipes that are unusual, such as a cleaning badge at the server room at 2 a.m. That is anomaly detection. Clustering is accepted as a second answer: you could find groups of normal behavior and look at the swipes that fit no group.',
  toolWhy:'Orange Data Mining and KNIME both take a table and can flag unusual records with no labels and no coding. SageMaker Canvas, Azure automated ML, and Vertex AI AutoML are not a fit here, because each needs a labeled column to predict, and this data has none.',
  concern:'Consistency: door names or building numbers may be typed differently by different systems. Accuracy: a broken badge reader can create thousands of false "unusual" swipes.'},
 {id:'c5',no:'Case 5',site:'Yokota',name:'Hangar 7 Aviation Maintenance',area:'Aviation maintenance',data:'Images',
  what:'A maintenance company that inspects jet engines for an airline and two military contracts.',
  who:'The lead engine inspector',
  problem:'For each engine, the lead inspector decides which fan blades to pull for a close inspection. She wants each blade photo marked as cracked or not cracked.',
  have:'6,000 photos taken with a borescope, a thin camera pushed inside the engine. Inspectors already labeled each photo cracked or not cracked.',
  sampleText:['Photo 0412: blade 7, engine 3 → <b>cracked</b>','Photo 0413: blade 8, engine 3 → <b>not cracked</b>','Photo 0414: blade 9, engine 3, oil smudge on lens → <b>not cracked</b>'],
  type:{best:['class'],ok:['od','anom']},
  tool:{best:['rekog','vertex'],ok:['canvas','tm']},
  typeWhy:'The output is a category for each photo: cracked or not cracked, and every photo is already labeled. That is classification using computer vision. Object detection is accepted: it would also show where the crack is, but the inspectors only labeled whole photos, so someone would have to draw boxes first. Anomaly detection is accepted, since a crack is unusual, but it throws away the labels the inspectors already made.',

 if(type==='rl') return 'Reinforcement learning learns by trial and error inside a simulation that awards points. This data is a record of the past, not a simulation. <b>What to change:</b> in step 3, pick a type of AI that learns from records.';
 if(!ins.length) return 'The model needs information to work from. <b>What to change:</b> in step 2, check at least one input variable.';
 const ids=ins.filter(n=>kind(n)==='id');

 if(type==='sent'){
  if(!ds.cols.some(x=>x[1]==='text')) return 'Sentiment analysis reads text to judge its tone. This data has no text column.';
  if(ds.sentMsg) return ds.sentMsg;
  if(out) return 'This sentiment tool uses a model already trained on tone, so it needs no output variable and no labels. <b>What to change:</b> in step 1, pick <b>Nothing to predict</b>.';
  if(!ins.some(n=>kind(n)==='text')) return `Sentiment analysis reads text. <b>What to change:</b> in step 2, check the text column, ${ds.cols.find(x=>x[1]==='text')[0]}.`;
  return null; }
 if(type==='clus'||type==='anom'){
  if(out){ let m=`${tn} does not predict a column. It ${type==='anom'?'learns what normal records look like and flags the ones that do not fit':'sorts the records into groups of similar ones'}, so nothing goes in step 1. <b>What to change:</b> in step 1, pick <b>Nothing to predict</b>.`;
   if(ds.hint) m+=' '+ds.hint(ins,type); return m; }
  if(ds.target) return `${tn} ignores answers this data already has. Every past record has ${ds.target}, which answers the question "${ds.question}" <b>What to change:</b> in step 1, pick ${ds.target}, and pick a type of AI that learns from it.`;
  if(!ds.run.includes(type)) return `${tn} can run on this data, but it does not answer the problem: ${ds.question} <b>What to change:</b> read the problem again and pick a different type of AI.`;
  if(ins.every(n=>kind(n)==='text')) return `${tn} in Part D works on categories and numbers, not free text. <b>What to change:</b> in step 2, check other input variables.`;
  return null; }

  if(out!==ds.itemCol) return `Recommendation suggests items. <b>What to change:</b> in step 1, pick the item column, ${ds.itemCol}. It is what the AI suggests.`;
  if(!ins.includes(ds.userCol)) return `Recommendation needs to know who did what. <b>What to change:</b> in step 2, check ${ds.userCol}.`;
  return null; }

 if(!out) return ds.target
  ? `${tn} learns from an output variable: the column that holds the answer for every past record. <b>What to change:</b> in step 1, pick the column that answers the question "${ds.question}"`
  : `${tn} learns to predict a column, but this data has no column that answers the problem: ${ds.question} <b>What to change:</b> keep <b>Nothing to predict</b> in step 1, and in step 3 pick a type of AI that needs no answer column, such as clustering, anomaly detection, or sentiment analysis.`;

  if(k==='date'||k==='time') return `${out} is a ${k==='date'?'date':'time of day'}, not a category to predict. <b>What to change:</b> in step 1, pick a column that is a category.`;
  if(k==='id') return `${out} is a record number. Every row has a different one, so there is nothing to learn. <b>What to change:</b> in step 1, pick a different column.`; }
 if(type==='reg'||type==='fore'){
  if(k!=='num') return `${tn} predicts a number. ${out} is ${k==='cat'?'a category ('+vals(out)+')':'a '+KIND[k].toLowerCase()}. <b>What to change:</b> in step 3, pick classification, or in step 1 pick a column that is a number.`;
  if(type==='fore'&&!ds.timeCol) return 'Time-series forecasting predicts a number from its past values over time. This data has no date column, so there is no order in time to learn from. <b>What to change:</b> in step 3, pick a different type of AI.'; }

}

/* CLASSIFICATION: every test record is a square, sorted into the model's piles */
function piles(groups,label){
 const per=15, s=12, gp=2, pw=per*(s+gp), W=groups.length*pw+(groups.length-1)*40+20;
 const rows=Math.max(...groups.map(g=>Math.ceil(g.items.length/per))), H=rows*(s+gp)+56;
 let g='';
 groups.forEach((gr,k)=>{ const x0=10+k*(pw+40);
  g+=`<text x="${x0}" y="16" class="tx b">${esc(gr.label)} (${gr.items.length})</text>`;
  gr.items.forEach((it,i)=>{ const x=x0+(i%per)*(s+gp), y=28+Math.floor(i/per)*(s+gp);
   g+=`<rect x="${x}" y="${y}" width="${s}" height="${s}" rx="2" fill="var(${it.c})">${tt(it.t)}</rect>`; }); });

/* REGRESSION and FORECASTING */
function lines(series,label,xl,yl,fmtX=x=>x){
 const W=640,H=240,L=58,R=14,T=14,B=34, xs=series.flatMap(s=>s.pts.map(p=>p[0])), ys=series.flatMap(s=>s.pts.map(p=>p[1]));
 const x0=Math.min(...xs),x1=Math.max(...xs), y0=Math.min(...ys), y1=Math.max(...ys), pad=(y1-y0)*.08||1, lo=y0-pad, hi=y1+pad;
 const px=x=>L+(x-x0)/(x1-x0||1)*(W-L-R), py=y=>H-B-(y-lo)/(hi-lo)*(H-B-T);
 let g=`<line x1="${L}" y1="${H-B}" x2="${W-R}" y2="${H-B}" class="ax"/><text x="14" y="${(T+H-B)/2}" text-anchor="middle" class="tx s" transform="rotate(-90 14 ${(T+H-B)/2})">${esc(yl)}</text>`;
 [lo+(hi-lo)*.15,(lo+hi)/2,hi-(hi-lo)*.15].forEach(v=>g+=`<line x1="${L}" y1="${py(v).toFixed(1)}" x2="${W-R}" y2="${py(v).toFixed(1)}" class="grid"/><text x="${L-6}" y="${(py(v)+4).toFixed(1)}" text-anchor="end" class="tx s">${Math.round(v)}</text>`);

 series.forEach(s=>{ g+=`<path d="${s.pts.map((p,i)=>`${i?'L':'M'}${px(p[0]).toFixed(1)},${py(p[1]).toFixed(1)}`).join(' ')}" fill="none" stroke="var(${s.c})" stroke-width="2" stroke-linejoin="round" ${s.dash?'stroke-dasharray="5 4"':''}/>`;
  s.pts.forEach(p=>g+=`<circle cx="${px(p[0]).toFixed(1)}" cy="${py(p[1]).toFixed(1)}" r="6" fill="transparent">${tt(`${s.name}: ${fmtX(p[0])}, ${r1(p[1])} ${yl}`)}</circle>`); });

function scatter(pts,label,xl,yl,o={}){

 let x0=Math.min(...xs),x1=Math.max(...xs),y0=Math.min(...ys),y1=Math.max(...ys); if(o.diag){ x0=y0=Math.min(x0,y0); x1=y1=Math.max(x1,y1); }

 let g=`<line x1="${L}" y1="${H-B}" x2="${W-R}" y2="${H-B}" class="ax"/><line x1="${L}" y1="${T}" x2="${L}" y2="${H-B}" class="ax"/>
  <text x="${(L+W-R)/2}" y="${H-8}" text-anchor="middle" class="tx s">${esc(xl)}</text><text x="14" y="${(T+H-B)/2}" text-anchor="middle" class="tx s" transform="rotate(-90 14 ${(T+H-B)/2})">${esc(yl)}</text>
  <text x="${L}" y="${H-B+15}" class="tx s">${f(x0)}</text><text x="${W-R}" y="${H-B+15}" text-anchor="end" class="tx s">${f(x1)}</text>

 pts.forEach(p=>g+=`<circle cx="${px(p.x).toFixed(1)}" cy="${py(p.y).toFixed(1)}" r="${p.r||3.4}" fill="var(${p.c})" fill-opacity="${p.op||.8}" stroke="var(--paper)" stroke-width="1">${tt(p.t)}</circle>`);

/* ---------- models ---------- */
const concl=items=>`<div class="card concl" style="display:none"><b>What an analyst would conclude</b><ul>${items.filter(Boolean).map(x=>`<li>${x}</li>`).join('')}</ul></div>`;
function tree(rows,feats,y,depth,pos){
 const gini=a=>{ if(!a.length) return 0; const c={}; a.forEach(r=>c[r[y]]=(c[r[y]]||0)+1); return 1-Object.values(c).reduce((s,v)=>s+(v/a.length)**2,0); };
 const maj=a=>{ const c={}; a.forEach(r=>c[r[y]]=(c[r[y]]||0)+1); return Object.keys(c).sort((p,q)=>c[q]-c[p])[0]; };
 const num=(r,f)=>f.time?parseInt(r[f.n]):+r[f.n];
 function grow(a,d,path){ const node={pred:maj(a),n:a.length,rate:a.filter(r=>r[y]===pos).length/a.length,path};
  if(d===0||a.length<30||gini(a)===0) return node;
  let best=null; const g0=gini(a);
  feats.forEach(f=>{ let tests;
   if(f.k==='num'){ const v=a.map(r=>num(r,f)).filter(x=>!isNaN(x)).sort((p,q)=>p-q);
    tests=[...new Set([.2,.4,.6,.8].map(q=>v[Math.floor(q*v.length)]))].map(t=>({fn:r=>num(r,f)>t,yes:`${f.n} above ${t}`,no:`${f.n} ${t} or below`})); }
   else tests=[...new Set(a.map(r=>r[f.n]))].map(v=>({fn:r=>r[f.n]===v,yes:`${f.n} is ${v}`,no:`${f.n} is not ${v}`}));
   tests.forEach(t=>{ const L=a.filter(t.fn), Rr=a.filter(r=>!t.fn(r)); if(L.length<15||Rr.length<15) return;
    const g=g0-(L.length*gini(L)+Rr.length*gini(Rr))/a.length; if(!best||g>best.g) best={...t,g,L,R:Rr}; }); });
  if(!best||best.g<1e-4) return node;
  node.test=best; node.yesN=grow(best.L,d-1,path.concat(best.yes)); node.noN=grow(best.R,d-1,path.concat(best.no)); delete best.L; delete best.R; return node; }

}
const predTree=(n,r)=>n.test?predTree(n.test.fn(r)?n.yesN:n.noN,r):n.pred;
const leaves=n=>n.test?leaves(n.yesN).concat(leaves(n.noN)):[n];

function nbTrain(rows,ins,y,ds){
 const toks=r=>ins.flatMap(n=>kindOf(ds,n)==='text'?String(r[n]).toLowerCase().match(/[a-z0-9]{3,}/g)||[]:[n+'='+r[n]]);
 const cls={}, cnt={}, tot={}, V=new Set();
 rows.forEach(r=>{ const c=r[y]; cls[c]=(cls[c]||0)+1; cnt[c]=cnt[c]||{}; toks(r).forEach(t=>{ cnt[c][t]=(cnt[c][t]||0)+1; tot[c]=(tot[c]||0)+1; V.add(t); }); });
 const pred=r=>{ let best=null,bs=-1e9; Object.keys(cls).forEach(c=>{ let s=Math.log(cls[c]/rows.length); toks(r).forEach(t=>s+=Math.log(((cnt[c][t]||0)+1)/(tot[c]+V.size))); if(s>bs){bs=s;best=c;} }); return best; };
 return {pred,cnt,tot,V};
}

function runClass(c,ds,out,ins){
 const sh=shuffled(ds.rows), cut=Math.floor(sh.length*.7), tr=sh.slice(0,cut), te=sh.slice(cut), pos=ds.pos;
 let predict, extra='';
 if(ins.some(n=>kindOf(ds,n)==='text')){
  const m=nbTrain(tr,ins,out,ds); predict=m.pred;
  const neg=Object.keys(m.cnt).find(k=>k!==pos);
  const words=[...m.V].filter(t=>!t.includes('=')&&(m.cnt[pos][t]||0)>=5).map(t=>[t,Math.log(((m.cnt[pos][t]||0)+1)/(m.tot[pos]+m.V.size))-Math.log(((m.cnt[neg][t]||0)+1)/(m.tot[neg]+m.V.size))]).sort((a,b)=>b[1]-a[1]).slice(0,8).map(x=>x[0]);
  extra=`<p><b>Words that most often marked ${ds.posName}:</b> ${words.join(', ')||'none found'}</p>`;
 } else {
  const t=tree(tr,ins.map(n=>({n,k:['num','time'].includes(kindOf(ds,n))?'num':'cat',time:kindOf(ds,n)==='time'})),out,3,pos); predict=r=>predTree(t,r);
  const L=leaves(t).filter(l=>l.n>=15&&l.path.length).sort((a,b)=>b.rate-a.rate).slice(0,3);
  extra=L.length?`<p><b>What the model learned (its three riskiest groups):</b></p><ul>${L.map(l=>`<li>If ${l.path.join(' and ')}: ${pct(l.rate)} ${ds.posWord} (${l.n} training records)</li>`).join('')}</ul>`:'';
 }
 const base=tr.filter(r=>r[out]!==pos).length>=tr.length/2?Object.keys(tr.reduce((o,r)=>(o[r[out]]=1,o),{})).find(k=>k!==pos):pos;
 let right=0,caught=0,P=0,fa=0; te.forEach(r=>{ const p=predict(r); if(p===r[out]) right++; if(r[out]===pos){ P++; if(p===pos) caught++; } else if(p===pos) fa++; });
 const baseAcc=te.filter(r=>r[out]===base).length/te.length, acc=right/te.length;
 const lk=ins.find(n=>ds.leak&&ds.leak[n]);

function solve(A,b){ const n=b.length, M=A.map((r,i)=>r.concat(b[i]));

 const html=`<div class="verdict best"><b>The model ran.</b> A tone model that was already trained read all ${ds.rows.length} comments. Nobody had to label any of them.</div>
  <div class="stats">${['positive','negative','neutral'].map(t=>`<div class="card"><div class="muted">${t[0].toUpperCase()+t.slice(1)}</div><div class="score">${cnt[t]}</div></div>`).join('')}</div>
  ${chartBox('Sentiment analysis: comments sorted by tone',legend([['--c1','Positive'],['--c0','Neutral'],['--c2','Negative']])+hstack((ins.includes('neighborhood')?Object.keys(by).sort().map(g=>[g,by[g]]):[['All comments',cnt]]).map(([g,b])=>({label:g,segs:[{v:b.positive,c:'--c1',lab:'Positive'},{v:b.neutral,c:'--c0',lab:'Neutral',dark:1},{v:b.negative,c:'--c2',lab:'Negative'}]})),'Stacked bars of positive, neutral, and negative comments'),ins.includes('neighborhood')?'Each bar is one neighborhood. The model read every comment and put it in one of three tones.':'The model read every comment and put it in one of three tones. Add neighborhood as an input to see one bar for each neighborhood.')}
  <div class="datab"><table><tr><th>Comment</th><th>Tone the model gave</th></tr>${show.map(([r,t])=>`<tr><td style="white-space:normal">${esc(r.comment)}</td><td>${t}${t!==r._tone?' <b class="bad">✗ wrong: this is '+r._tone+'</b>':''}</td></tr>`).join('')}</table></div>
  <div class="verdict ok"><b>The model agreed with a person on ${pct(agree/ds.rows.length)} of the comments.</b> Most misses are sarcasm, such as "Great, another rule." The word "great" reads as positive, but the writer is unhappy.</div>
  ${concl([Math.abs(cnt.negative-cnt.positive)<ds.rows.length*.1?`Residents who commented are split: ${cnt.negative} negative and ${cnt.positive} positive comments, with ${cnt.neutral} neutral. The director should expect both sides at the town meeting.`:`More comments are ${cnt.negative>cnt.positive?'against':'for'} the rule than ${cnt.negative>cnt.positive?'for':'against'} it: ${cnt.negative} negative and ${cnt.positive} positive, with ${cnt.neutral} neutral.`,'Sarcasm makes the model count some unhappy residents as happy, so the true count of negative comments is a little higher.','Before the town meeting, the director should read a sample of comments herself, not just report the counts. And people who comment online may not speak for everyone.'])}`;
 return {html,summary:`Sentiment analysis of ${txt}: ${cnt.positive} positive, ${cnt.negative} negative, ${cnt.neutral} neutral; agreed with a person on ${pct(agree/ds.rows.length)}.`};
}

/* ---------- the Part D screen ---------- */
function workbench(c,w){
 const box=document.getElementById('wb'); if(!box) return;
 const back=`<div class="row"><button class="btn" id="toBoard2">Back to the cases</button></div>`;
 if(!WB_DS[c.id]){ box.innerHTML=`<div class="kicker">Part D</div><h3>Test it on data</h3><p>${NO_WB[c.id]}</p>${NO_WB_CHART[c.id]?NO_WB_CHART[c.id]():''}${back}`; $('#toBoard2').onclick=()=>go(1); return; }
 const ds=getDS(c.id), T=w.test||(w.test={out:'',ins:[],type:w.type,k:4,tries:0,blocked:0,summary:''});
 const show=ds.cols.map(x=>x[0]);
 box.innerHTML=`<div class="kicker">Part D</div><h3>Test it on data</h3>
  <p>Here is mock data for ${c.name}: ${fmtN(ds.rows.length)} made-up records built to look like the real thing. Build a model and see whether your choices work.</p>
  ${next('<ol style="margin:0;padding-left:20px"><li>Pick the <b>output variable</b>: the column the AI should predict. If no column answers the problem, pick <b>Nothing to predict</b>.</li><li>Check the <b>input variables</b> the AI may use.</li><li>Pick a <b>type of AI</b>.</li><li>Select <b>Run the model</b>. If a choice does not fit, a message says why. Change it and run again.</li></ol>')}
  <div class="datab"><table><tr>${show.map(n=>`<th class="mono" style="text-transform:none">${n}<br><span class="kindtag">${KIND[kindOf(ds,n)]}</span></th>`).join('')}</tr>${ds.rows.slice(0,6).map(r=>`<tr>${show.map(n=>`<td>${esc(r[n])}</td>`).join('')}</tr>`).join('')}</table></div>
  <div class="row"><button class="btn ghost" id="wDl">Download the data (CSV file: comma-separated values, opens in Excel)</button><span class="counter">Showing 6 of ${fmtN(ds.rows.length)} rows.</span></div>
  <div class="grid2"><div>
   <label class="f" for="wOut">1. Output variable: what the AI predicts</label>
   <select id="wOut"><option value="">Nothing to predict</option>${show.map(n=>`<option value="${n}" ${T.out===n?'selected':''}>${n} (${KIND[kindOf(ds,n)]})</option>`).join('')}</select>
   <label class="f">2. Input variables: what the AI may use</label><div class="ins" id="wIns"></div>
  </div><div>
   <label class="f" for="wType">3. Type of AI</label>
   <select id="wType">${TYPES.map(t=>`<option value="${t.id}" ${T.type===t.id?'selected':''}>${t.name}</option>`).join('')}</select>
   <p class="counter" id="wUse" style="margin-top:6px"></p>
   <div id="wKbox"><label class="f" for="wK">Number of groups</label><select id="wK">${[2,3,4,5].map(k=>`<option ${T.k===k?'selected':''}>${k}</option>`).join('')}</select></div>
   <div class="row"><button class="btn" id="wRun">Run the model</button></div>
   <p class="counter" id="wTries"></p>
  </div></div>
  <div id="wRes">${T.summary?`<div class="card"><b>Your last run that worked:</b> ${esc(T.summary)}</div>`:''}</div>
  <div class="sheet" style="box-shadow:none;border:1px solid var(--line);padding:18px 20px;margin-top:16px" id="wWrite">
   <div class="kicker">Part D · Explain your result</div>
   <p id="wLock" class="counter"></p>
   <label class="f" for="wMeans">1. What does your result tell ${c.who.replace(/^The /,'the ')} about the problem? Use numbers from your run.</label>
   <p class="counter" style="margin:0 0 4px">The problem: ${c.problem}</p>
   <textarea id="wMeans">${esc(T.means||'')}</textarea><div class="counter" id="wMeansC"></div>
   <label class="f" for="wBenefit">2. What is the benefit of using this AI? What would you check or change before ${c.who.replace(/^The /,'the ')} acts on the result?</label>
   <textarea id="wBenefit">${esc(T.benefit||'')}</textarea><div class="counter" id="wBenefitC"></div>
   <div class="row"><button class="btn" id="wShow" disabled>Compare with an analyst's conclusions</button><span class="counter" id="wShowWhy"></span></div>
  </div>${back}`;
 const drawIns=()=>{ $('#wIns').innerHTML=show.filter(n=>n!==T.out).map(n=>`<label class="inbox"><input type="checkbox" value="${n}" ${T.ins.includes(n)?'checked':''}> <span class="mono">${n}</span> <span class="kindtag">${KIND[kindOf(ds,n)]}</span></label>`).join('');
  $$('#wIns input').forEach(x=>x.onchange=()=>{ T.ins=$$('#wIns input:checked').map(y=>y.value); save(); }); };
 const tries=()=>{ $('#wTries').textContent=T.tries?`Runs so far: ${T.tries}. Choices that did not fit: ${T.blocked}.`:''; };
 const USE={class:'Predicts a category. In step 1, pick the column it learns to predict.',reg:'Predicts a number. In step 1, pick the column it learns to predict.',fore:'Predicts future values of a number. In step 1, pick the number it forecasts.',clus:'Does not predict a column. In step 1, pick Nothing to predict.',anom:'Does not predict a column. In step 1, pick Nothing to predict.',rec:'Suggests items. In step 1, pick the item column it suggests.',sent:'Uses a model already trained on tone. In step 1, pick Nothing to predict.',rl:'Learns inside a simulation.',od:'Works on images.',speech:'Works on audio.',gen:'GenAI.'};
 const kbox=()=>{ $('#wKbox').style.display=T.type==='clus'?'block':'none'; $('#wUse').textContent=USE[T.type]||''; };
 drawIns(); tries(); kbox();
 const wr=()=>{ const on=!!T.summary; ['#wMeans','#wBenefit'].forEach(i=>$(i).disabled=!on);
  $('#wLock').innerHTML=on?'Answer both questions about your last run that worked. Your answers go into your team report.':'<b>Run the model first.</b> These questions open after a run that works.';
  const done=[['#wMeans','#wMeansC'],['#wBenefit','#wBenefitC']].map(([a,b])=>{ const n=$(a).value.trim().length; $(b).textContent=!on?'':n<MIN?`Write at least ${MIN-n} more characters.`:'Long enough.'; return n>=MIN; });
  const ready=on&&done[0]&&done[1]; $('#wShow').disabled=!ready; $('#wShowWhy').textContent=ready?'':'Opens after you answer both questions.'; };
 $('#wShow').onclick=()=>{ $$('#wRes .concl').forEach(x=>x.style.display='block'); const x=$('#wRes .concl'); if(x) x.scrollIntoView({behavior:'smooth',block:'center'}); };
 $('#wMeans').oninput=e=>{ T.means=e.target.value; save(); wr(); }; $('#wBenefit').oninput=e=>{ T.benefit=e.target.value; save(); wr(); };
 wr();
 $('#wOut').onchange=e=>{ T.out=e.target.value; T.ins=T.ins.filter(n=>n!==T.out); save(); drawIns(); };
 $('#wType').onchange=e=>{ T.type=e.target.value; save(); kbox(); };
 $('#wK').onchange=e=>{ T.k=+e.target.value; save(); };
 $('#wDl').onclick=()=>{ const q=v=>/[",\n]/.test(String(v))?'"'+String(v).replace(/"/g,'""')+'"':v;
  const csv=[show.join(',')].concat(ds.rows.map(r=>show.map(n=>q(r[n])).join(','))).join('\n');
  const a=document.createElement('a'); a.href=URL.createObjectURL(new Blob(['﻿'+csv],{type:'text/csv'})); a.download=c.name.replace(/[^A-Za-z0-9]+/g,'_')+'_mock_data.csv'; document.body.appendChild(a); a.click(); a.remove(); };
 $('#toBoard2').onclick=()=>go(1);
 $('#wRun').onclick=()=>{ T.tries++; const out=T.out||null, ins=T.ins.slice(), type=T.type, msg=check(c,ds,out,ins,type);
  if(msg){ T.blocked++; $('#wRes').innerHTML=`<div class="verdict miss"><b>This does not work.</b> ${msg}</div>`; }
  else { const r=type==='class'?runClass(c,ds,out,ins):type==='reg'||type==='fore'?runReg(c,ds,out,ins,type):type==='anom'?runAnom(c,ds,ins):type==='clus'?runClus(c,ds,ins,T.k):type==='rec'?runRec(c,ds):runSent(c,ds,ins);
   T.summary=r.summary; $('#wRes').innerHTML=r.html; wr(); }
  save(); tries(); $('#wRes').scrollIntoView({behavior:'smooth',block:'nearest'}); };
}

Object.values(S.work).forEach(w=>{ if(w.prob&&!w.probQ&&!w.probB){ const g=(PROBS.find(x=>x.id===w.prob)||{}).g; if(g==='q') w.probQ=w.prob; else if(g==='b'){ w.probB=w.prob; w.concernB=w.concern; } } });
S.step=0; save();
render();
</script>
</body>
</html>
